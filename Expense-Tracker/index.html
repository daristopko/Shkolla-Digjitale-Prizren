<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    <a href="pages/add-transaction.html" class="btn btn-primary btn-sm">+ Add Transaction</a>
  </nav>

  <!-- Summary Cards -->
  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-4">
        <div class="card text-white bg-secondary">
          <div class="card-body">
            <h6 class="card-title">Balance</h6>
            <h4 id="balance">€0.00</h4>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-white bg-success">
          <div class="card-body">
            <h6 class="card-title">Total Income</h6>
            <h4 id="total-income">€0.00</h4>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-white bg-danger">
          <div class="card-body">
            <h6 class="card-title">Total Expenses</h6>
            <h4 id="total-expenses">€0.00</h4>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Budget -->
  <div class="container mt-4">
    <div class="card p-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label class="form-label mb-0">Monthly Budget (€)</label>
        </div>
        <div class="col-md-4">
          <input type="number" id="budget-input" class="form-control" min="0" step="0.01" placeholder="e.g. 500" />
        </div>
        <div class="col-md-4">
          <button id="save-budget-btn" class="btn btn-primary w-100">Save Budget</button>
        </div>
      </div>
      <div id="budget-warning" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
    </div>
  </div>

  <!-- Charts -->
  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Expenses by Category</h6>
          <canvas id="category-chart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Monthly Expenses (Last 6 Months)</h6>
          <canvas id="monthly-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-4">
        <input type="text" id="search-input" class="form-control" placeholder="Search by description..." />
      </div>
      <div class="col-md-4">
        <select id="filter-category" class="form-select">
          <option value="all">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="filter-type" class="form-select">
          <option value="all">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Transaction Table -->
  <div class="container mt-4">
    <div class="card p-3">
      <h5 class="mb-3">Transactions</h5>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" />
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" id="edit-description" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (€)</label>
            <input type="number" id="edit-amount" class="form-control" min="0.01" step="0.01" />
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select id="edit-type" class="form-select">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select id="edit-category" class="form-select">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" id="edit-date" class="form-control" />
          </div>
          <div id="edit-error" class="text-danger mb-2" style="display:none;">Please fill in all fields correctly.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
