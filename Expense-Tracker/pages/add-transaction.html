<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Transaction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Add Transaction</span>
    <a href="../index.html" class="btn btn-outline-light btn-sm">← Back</a>
  </nav>

  <!-- Form -->
  <div class="container mt-4">
    <div class="card p-4">
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <input type="text" id="description" class="form-control" placeholder="e.g. Bus ticket" />
      </div>
      <div class="mb-3">
        <label for="amount" class="form-label">Amount (€)</label>
        <input type="number" id="amount" class="form-control" placeholder="e.g. 4.50" min="0.01" step="0.01" />
      </div>
      <div class="mb-3">
        <label for="type" class="form-label">Type</label>
        <select id="type" class="form-select">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select id="category" class="form-select">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" class="form-control" />
      </div>
      <div id="error-msg" class="text-danger mb-2" style="display:none;">Please fill in all fields correctly.</div>
      <button id="save-btn" class="btn btn-primary w-100">Save Transaction</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/transactions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
