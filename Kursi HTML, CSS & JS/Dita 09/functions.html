<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions Example</title>
</head>
<body>
    <h1>Functions</h1>

    <h2>Shembull 1</h2>
    <script>
        // Funksionet jane blloqe kodi te cilat mund te perdoren dhe thirren me shume se nje here
        function shuma(a, b) {
            return a + b;
        }

        document.write("Shuma e 5 dhe 3 eshte: " + shuma(5, 3) + "<br>");
        document.write("Shuma e 10 dhe 20 eshte: " + shuma(10, 20) + "<br>");
        document.write("Shuma e 7 dhe 8 eshte: " + shuma(7, 8) + "<br>");
    </script>

    <h2>Shembull 2</h2>
    <script>
        var x = 7;
        var y = 12;
        function b(x, y) // Variabla e shenuara si parameter.
        {
            var x = 3;
            var y = 7;
            var z = x + y;
                return z;
        }
        document.write(b(3, 4));
        document.write(z);
    </script>
</body>
</html>
