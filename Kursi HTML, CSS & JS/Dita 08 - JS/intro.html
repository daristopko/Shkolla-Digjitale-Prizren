<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Introduction</title>
</head>
<body>
    <h2>JavaScript Introduction</h2>

    <p id="p1"></p>
    <hr>
    <p id="p2"></p>

    <script>
        // Var eshte nje keyword i vjeter per te deklaruar variabla, por eshte ende i perdorur ne disa raste.
        var name = "Daris";
        document.write("Name: " + name + "<br>");

        // Let eshte nje keyword me i ri dhe ofron nje scope me te kufizuar, duke e bere me te sigurt per perdorim.
        let age = 15;
        document.write("Age: " + age + "<br>");

        // Const eshte nje keyword per te deklaruar variabla qe nuk mund te ndryshoje vleren e saj pas inicializmit.
        const pi = 3.14;
        document.write("Pi: " + pi + "<br>");
    </script>
    <script src="intro.js"></script>
</body>
</html>
