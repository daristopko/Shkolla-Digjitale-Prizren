<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>HTML Form Example:</h2>
        <form>
            <label>Emri</label>
            <input type="text" placeholder="Shkruaj emrin" maxlength="10" minlength="3" size="10">
<br><br>
            <label>Email:</label>
            <input type="email" placeholder="Shkruaj email-in" required>
<br><br>
            <label>Fjalekalimi:</label>
            <input type="password">
<br><br>
            <label>Mosha</label>
            <input type="number">
<br><br>
            <label>Data e Lindjes:</label>
            <input type="date">
<br><br>
            <label>Ngjyra e preferuar:</label>
            <input type="color">
<br><br>
            <label>Koha e takimit dergo CV:</label>
            <input type="file">
<br><br>
            <label>Vleresimi:</label>
            <input type="range">
<br><br>
            <input type="submit" value="Login">
            <input type="reset" value="Reset">
        </form>
<hr>
    <h2>Select+Options</h2>
        <select>
            <option>Prizren</option>
            <option>Peje</option>
            <option>Prishtine</option>
        </select>
<hr>
    <h2>Semantic Elements</h2>
    <header>
        <h1>Faqja Ime</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>
    <main>
        <section>
            <h2>Lajme</h2>
            <article>
                <p>Kjo eshte nje artikull.</p>
            </article>
        </section>
    </main>
    <footer>
       &copy Copyright 2026
    </footer>
<hr style="height: 10px;background-color: red;">
</body>
</html>
